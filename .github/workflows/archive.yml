# Saves NESO's published day-ahead carbon intensity forecast every day, to the `archive`
# branch (archive/{neso,weather}/YYYY/MM/YYYY-MM-DD.json), with the weather forecasts the
# model uses. The Carbon Intensity API only keeps the
# latest revision of each forecast, so the day-ahead one has to be saved when it is issued:
# it is the benchmark the project's own day-ahead model is scored against.
# GitHub may start scheduled runs late; each file records the time it was read, and the
# second run only fills a day the first one missed.
name: Archive NESO forecast

on:
  schedule:
    - cron: "5 9 * * *"
    - cron: "35 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04  # its python3 is 3.12; the script needs only the standard library
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: code
          persist-credentials: false

      - name: Check out the archive branch (created on the first run)
        env:
          REPO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          if git ls-remote --exit-code --heads "$REPO" archive >/dev/null; then
            git clone --depth 1 --branch archive "$REPO" archive
          else
            git init -b archive archive
          fi

      - name: Read today's forecast
        run: PYTHONPATH=code/src python3 -m carbon_intensity_forecast.archive archive

      - name: Commit it
        env:
          REPO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          cd archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "NESO forecast issued $(date -u +%F)"
          git push "$REPO" HEAD:archive
