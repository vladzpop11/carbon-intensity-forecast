# Saves NESO's published day-ahead carbon intensity forecast every day, to the `archive`
# branch (archive/{neso,weather,intensity}/YYYY/MM/YYYY-MM-DD.json), with the model's
# inputs as published then (weather forecasts, recent actual values). The Carbon Intensity API only keeps the
# latest revision of each forecast, so the day-ahead one has to be saved when it is issued:
# it is the benchmark the project's own day-ahead model is scored against.
# GitHub starts scheduled runs late (4-5 hours on 2026-10-23 and 24) or skips them, so the
# job runs every 30 minutes from 02:30 to 09:30 UTC and keeps, each day, the read closest to
# 09:00 UTC (archive.py); the times of all reads are listed in the file.
name: Archive NESO forecast

on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 3 * * *"
    - cron: "0 3 * * *"
    - cron: "30 4 * * *"
    - cron: "0 4 * * *"
    - cron: "30 5 * * *"
    - cron: "0 5 * * *"
    - cron: "30 6 * * *"
    - cron: "0 6 * * *"
    - cron: "30 7 * * *"
    - cron: "0 7 * * *"
    - cron: "30 8 * * *"
    - cron: "0 8 * * *"
    - cron: "30 9 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04  # its python3 is 3.12; the script needs only the standard library
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: code
          persist-credentials: false

      # The token travels as an HTTP header, never in a URL that git would store.
      - name: Check out the archive branch (created on the first run)
        env:
          TOKEN: ${{ github.token }}
          REPO: https://github.com/${{ github.repository }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          for attempt in 1 2 3; do
            heads=$(git -c http.extraheader="$auth" ls-remote --heads "$REPO" archive) && break
            [ "$attempt" = 3 ] && exit 1; sleep 20
          done
          if [ -n "$heads" ]; then
            git -c http.extraheader="$auth" clone --depth 1 --branch archive "$REPO" archive
          else
            git init -b archive archive
          fi

      - name: Read today's forecasts and inputs
        run: PYTHONPATH=code/src python3 -m carbon_intensity_forecast.archive archive

      # Runs even if one snapshot failed, so the others are kept.
      - name: Commit what was read
        if: always()
        env:
          TOKEN: ${{ github.token }}
          REPO: https://github.com/${{ github.repository }}
        run: |
          [ -d archive ] || exit 0
          cd archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "Archived $(date -u +%F): NESO forecast and model inputs"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" push "$REPO" HEAD:archive
