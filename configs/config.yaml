# Carbon intensity forecast: data, task and pipeline settings.

# The task: every day at the issue time (UTC), forecast the 48 half hours of the next day,
# using only what was known at that time.
task:
  issue_hour_utc: 9        # NESO's forecast is archived at about this time too (archive.yml)
  horizon_half_hours: 48   # the next day, 00:00-23:30 UTC
  # Weather inputs. Open-Meteo's previous_dayN for a valid time t is the latest model run made
  # at least 24*N hours before t, so its final value comes from a run made about 24*N hours
  # before t (observed 2026-10-21: for hours more than 24 hours ahead, previous_day1 equals the
  # current run). It was available at the issue time only if that run was published by then:
  # lead N is used for target t only when t - 24*N hours <= issue time - this delay.
  weather_availability_delay_hours: 6
  # The actual value of a half hour is published at its end; allow another 30 minutes, so at
  # the issue time the last value used is the half hour that started an hour earlier.
  actual_delay_minutes: 30

data:
  raw_dir: data/raw
  # Carbon Intensity API (NESO), CC BY 4.0: national actual and latest forecast.
  intensity_api: https://api.carbonintensity.org.uk
  intensity_start: "2018-01-01"
  # Weather forecasts at fixed lead times: settings in weather.json (shared with archive.py).
  weather: configs/weather.json

# Evaluation, fixed before any model was trained (2026-10-21). Rolling origin by month: for
# each month of target days, train on every issue day whose target day ended before the first
# issue time of that month, then forecast the month.
# - development: all design choices (features, model settings) are made on these months only;
# - final test: scored once, when the design is frozen, like a held-out test set;
# - live: from 2026-10-22, against NESO's day-ahead forecasts archived by archive.yml.
evaluation:
  development_months: ["2024-10", "2025-12"]   # first and last month of target days
  final_test_months: ["2026-01", "2026-09"]
  metric: mae   # mean absolute error, gCO2/kWh

# The model, set before the first backtest (2026-10-21), from common LightGBM defaults for a
# few tens of thousands of rows; any change is made on development months only.
model:
  kind: lightgbm
  params:
    # regression_l1 chosen by the experiment rule below (reports/experiments.json, commit
    # c5ecf80): development MAE 20.65 against 21.00 as set. Design frozen 2026-10-22.
    objective: regression_l1
    n_estimators: 600
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 40
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    random_state: 0
    n_jobs: 2
    verbose: -1
# Baselines, all known at the issue time: the same half hour on the latest day it is known
# (the issue day for early slots, else the day before), and a week before the target.
baselines: [same_time_latest, same_time_week_before]

# Development experiments (make experiments), fixed before running them (2026-10-22). Each is
# the model above with some settings changed, backtested on the development months and logged
# to MLflow. Rule: the lowest development MAE wins, but `as_set` is kept unless another
# candidate beats it by more than `margin` gCO2/kWh. Ablations are measured, never chosen.
experiments:
  margin: 0.2
  candidates:
    as_set: {}
    l1_objective: {objective: regression_l1}
    slower_longer: {n_estimators: 1500, learning_rate: 0.015}
  ablations:
    without_weather: {drop_features_starting: [wind_, shortwave_, temperature_, solar_, weather_]}

mlflow:
  tracking_uri: http://127.0.0.1:5050   # the compose service; MLFLOW_TRACKING_URI overrides it

# Production training and promotion (make train), fixed before the first run (2026-10-22).
# Each run trains an evaluation twin on data up to `holdout_days` before the last known day,
# forecasts those days, and checks the gates on them. If they pass, the same setup is refit
# on all data and becomes the registered champion (MLflow alias), with the gate results as
# tags. A champion trained before the holdout window starts sees those days as new too.
registry:
  model_name: carbon-intensity-day-ahead
  holdout_days: 28
  gates:
    # 1. Beat the best simple rule by a clear margin (development skill was 55%).
    min_skill_vs_baseline: 0.30
    baseline: same_time_latest
    # 2. Strictly lower MAE than the current champion on the same holdout days, compared
    #    fairly (clarified 2026-10-22, before the first comparison with a champion):
    #    - champion trained before the holdout window: the champion model itself, on days
    #      new to both;
    #    - champion trained into the window (it has seen some of it): the champion's
    #      settings retrained on the same data as the challenger's twin;
    #    - same settings and features as the champion (a routine refresh with newer data):
    #      passes, since it is the champion's own setup; gate 1 still applies.
    beat_champion: true

# Monitoring and retraining (make monitor), fixed before the first live scores (2026-10-22).
# Live forecasts are scored once a target day's actual values are complete, next to NESO's
# archived day-ahead forecast and the baseline.
monitoring:
  database_url: postgresql+psycopg://forecast:forecast@127.0.0.1:5432/forecast   # compose
  neso_archive_url: https://raw.githubusercontent.com/vladzpop11/carbon-intensity-forecast/archive/neso
  first_live_issue_day: "2026-10-22"
  # Drift (Evidently): the model's inputs over the last 28 issue days against the same 28
  # days a year earlier (inputs follow the seasons, so a recent window would always differ).
  drift:
    window_days: 28
    share_threshold: 0.5   # share of drifted features that counts as drift
  # Retraining triggers, checked daily; any one starts the training flow, whose promotion
  # gates still decide whether the new model is served.
  retrain:
    min_scored_days: 7
    rolling_days: 14
    # 1. Performance: the rolling MAE exceeds the development MAE (20.65) by 30%.
    max_mae_ratio: 1.3
    # 2. Drift as supporting evidence: drift detected and the rolling MAE 10% above it.
    drift_mae_ratio: 1.1
    reference_mae: 20.65
    # 3. Staleness: the champion was trained through more than this many days ago.
    max_model_age_days: 28
    # No automatic retraining within this many days of the last one.
    cooldown_days: 7
