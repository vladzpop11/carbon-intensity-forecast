# The local stack. Docker Desktop on this Mac has 4 GB, so every service is sized for that
# (memory per service in the README).
name: carbon-forecast

services:
  # Experiment tracking and the model registry. SQLite and the artifacts live on one volume;
  # the server serves artifacts itself, so clients need no storage credentials.
  # - MLFLOW_SERVER_ENABLE_JOB_EXECUTION=false: MLflow 3.17 otherwise starts 8 GenAI job
  #   workers (about 1.6 GB instead of about 400 MB).
  # - --workers 1: the default is 4 web workers of about 250 MB each, for one user here.
  # - --allowed-hosts: MLflow 3 refuses other Host headers (exact host:port matches).
  # - Host port 5050: macOS AirPlay Receiver holds 5000.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --allowed-hosts mlflow:5000,localhost:5050,127.0.0.1:5050
      --workers 1
    environment:
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    ports:
      - "127.0.0.1:5050:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # The forecast API, serving the registry's champion (reloaded when the alias moves).
  api:
    build: .
    image: carbon-forecast-api:dev
    environment:
      MODEL_URI: models:/carbon-intensity-day-ahead@champion
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  # Data source and dashboards are provisioned from monitoring/grafana. Bound to this
  # machine only; anonymous visitors can view.
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mlflow-data:
  prometheus-data:
  grafana-data:
