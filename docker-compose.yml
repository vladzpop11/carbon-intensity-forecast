# The local stack. Docker Desktop on this Mac has 4 GB, so every service is sized for that
# (memory per service in the README).
name: carbon-forecast

services:
  # Experiment tracking and the model registry. SQLite and the artifacts live on one volume;
  # the server serves artifacts itself, so clients need no storage credentials.
  # - MLFLOW_SERVER_ENABLE_JOB_EXECUTION=false: MLflow 3.17 otherwise starts 8 GenAI job
  #   workers (about 1.6 GB instead of about 400 MB).
  # - --workers 1: the default is 4 web workers of about 250 MB each, for one user here.
  # - --allowed-hosts: MLflow 3 refuses other Host headers (exact host:port matches).
  # - Host port 5050: macOS AirPlay Receiver holds 5000.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --allowed-hosts mlflow:5000,localhost:5050,127.0.0.1:5050
      --workers 1
    environment:
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    ports:
      - "127.0.0.1:5050:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # Monitoring store: live forecasts, NESO's archived forecasts, scores and drift, read by
  # Grafana through a SELECT-only role. Passwords come from .env (make secrets); local only.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: forecast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make secrets}
      POSTGRES_DB: forecast
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./monitoring/postgres/roles.sql:/etc/roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forecast -d forecast"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # The forecast API, serving the registry's champion (reloaded when the alias moves).
  api:
    build: .
    image: carbon-forecast-api:dev
    environment:
      MODEL_URI: models:/carbon-intensity-day-ahead@champion
      FALLBACK_MODEL_URI: /app/models/champion   # the export inside the image
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Fail fast when MLflow is down (the client default retries for about 4 minutes).
      MLFLOW_HTTP_REQUEST_TIMEOUT: "5"
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "0"
    mem_limit: 512m
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  # Data sources and dashboards are provisioned from monitoring/grafana. Bound to this
  # machine only; anonymous visitors can view; the admin password is in .env.
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make secrets}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?run make secrets}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # Orchestration: the Prefect server (UI on http://127.0.0.1:4200) and the scheduler, which
  # runs the daily flow at start (catching up on missed days) and then at 09:30 UTC.
  prefect-server:
    image: prefecthq/prefect:3.9.0-python3.12
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_UI_API_URL: http://127.0.0.1:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - prefect-data:/root/.prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s
    restart: unless-stopped

  # The flow writes data/, models/, reports/ and DVC's state; the code, the configuration
  # and git (for the commit it records) are mounted read-only. Runs as a non-root user; the
  # DagsHub token arrives in its environment, .env itself is not mounted.
  scheduler:
    build:
      context: .
      target: pipeline
    image: carbon-forecast-pipeline:dev
    user: "1000:1000"
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MONITORING_DATABASE_URL: postgresql+psycopg://forecast:${POSTGRES_PASSWORD:?run make secrets}@postgres:5432/forecast
      DAGSHUB_TOKEN: ${DAGSHUB_TOKEN:?set in .env}
    mem_limit: 1536m
    volumes:
      - ./data:/project/data
      - ./models:/project/models
      - ./reports:/project/reports
      - ./.dvc:/project/.dvc
      - ./.dvcignore:/project/.dvcignore:ro
      - ./src:/project/src:ro
      - ./configs:/project/configs:ro
      - ./pyproject.toml:/project/pyproject.toml:ro
      - ./uv.lock:/project/uv.lock:ro
      - ./.git:/project/.git:ro
    depends_on:
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prefect-data:
  postgres-data:
  mlflow-data:
  prometheus-data:
  grafana-data:
