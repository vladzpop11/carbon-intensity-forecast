# The forecast API, serving the champion exported into the image (the cluster does not
# reach the MLflow server).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecast-api
  namespace: carbon-forecast
  labels: {app: forecast-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: forecast-api}
  template:
    metadata:
      labels: {app: forecast-api}
    spec:
      automountServiceAccountToken: false   # the API never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: forecast-api   # set by the overlay
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: MODEL_URI, value: /app/models/champion}
            - {name: HOME, value: /tmp}
          # Loading the model takes a few seconds; until then neither other probe runs.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          # Liveness only checks that the server accepts connections: a slow upstream API
          # (requests waiting on it) must not get the pod restarted.
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
