apiVersion: 1
datasources:
  - name: Monitoring
    uid: monitoring
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana_reader   # SELECT only (monitoring/postgres/roles.sql)
    jsonData:
      database: forecast
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD   # from .env (make secrets)
    editable: false
