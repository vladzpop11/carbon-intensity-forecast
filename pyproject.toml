[project]
name = "carbon-intensity-forecast"
version = "0.1.0"
description = "Day-ahead forecasts of Great Britain's grid carbon intensity, scored live against the operator's own forecast: an end-to-end MLOps pipeline"
readme = "README.md"
authors = [
    { name = "Vladzpop", email = "291580488+vladzpop11@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "holidays>=0.107",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "mlflow-skinny>=3.17,<3.18",
    "numpy>=2",
    "pandas>=3",
    "pandera>=0.34.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dvc[s3]>=3.67",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
